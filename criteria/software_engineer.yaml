# Rubric for the "software_engineer" role.
#
# The scorer evaluates each résumé against every criterion on a 0–5 scale, then
# computes a weighted total. `must_haves` are hard gates: a candidate that
# clearly fails one is flagged regardless of their weighted score.
#
# Copy this file to criteria/<your_role>.yaml and edit for new roles.

role: software_engineer
title: "Software Engineer"
description: >
  Builds and maintains production software. We care about hands-on coding
  ability, system design, collaboration, and a track record of shipping.

# Scale used for every criterion (shown to the model so scores are calibrated).
scale:
  0: "No evidence / disqualifying"
  1: "Minimal — barely touches the criterion"
  2: "Below expectations"
  3: "Meets expectations"
  4: "Exceeds expectations"
  5: "Exceptional — clearly top-tier"

# Weighted criteria. Weights are relative; they're normalized automatically.
criteria:
  - id: coding_ability
    name: "Coding & technical depth"
    weight: 3
    guidance: >
      Depth of hands-on engineering: languages, frameworks, code quality
      signals, open-source or side projects, technical ownership.

  - id: experience_relevance
    name: "Relevant experience"
    weight: 3
    guidance: >
      Years and relevance of professional software experience. Production
      systems, scale, and domains close to ours score higher.

  - id: system_design
    name: "System design & architecture"
    weight: 2
    guidance: >
      Evidence of designing systems, making architecture decisions, and
      reasoning about scalability, reliability, and trade-offs.

  - id: impact
    name: "Demonstrated impact"
    weight: 2
    guidance: >
      Concrete, quantified outcomes (perf gains, revenue, users, latency,
      cost). Vague responsibilities score lower than measurable results.

  - id: collaboration
    name: "Collaboration & communication"
    weight: 1
    guidance: >
      Teamwork, mentorship, cross-functional work, code review, and clear
      written communication signals.

# Hard gates. Phrase each as a requirement; the model judges pass/fail/unknown.
must_haves:
  - "At least 2 years of professional software engineering experience."
  - "Proficiency in at least one mainstream programming language."
