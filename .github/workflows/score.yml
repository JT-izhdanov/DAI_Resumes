name: Assess résumés

# Manually-triggered assessment run. Scores a résumé pool against a role's
# criteria and uploads the ranking (ranking.md + per-candidate JSON) as an
# artifact.
#
# Requires the repository secret ANTHROPIC_API_KEY (Settings → Secrets and
# variables → Actions). Calls the Claude API, so it consumes API credits.

on:
  workflow_dispatch:
    inputs:
      role:
        description: "Role whose criteria to score against (see roles/)."
        required: true
        default: "data_engineer"
      pool:
        description: "Résumé pool: a role name or path. Blank = the role's own pool."
        required: false
        default: ""
      label:
        description: "Results subfolder name (optional)."
        required: false
        default: ""

jobs:
  assess:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Assess and rank
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ROLE: ${{ github.event.inputs.role }}
          POOL: ${{ github.event.inputs.pool }}
          LABEL: ${{ github.event.inputs.label }}
        run: |
          args=(assess "$ROLE")
          [ -n "$POOL" ] && args+=(--pool "$POOL")
          [ -n "$LABEL" ] && args+=(--label "$LABEL")
          python -m src.cli "${args[@]}"

      - name: Upload ranking
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ranking-${{ github.event.inputs.role }}
          path: results/${{ github.event.inputs.role }}/
          if-no-files-found: warn
